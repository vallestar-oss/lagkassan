name: Keep alive

# Supabase pauses free projects after about a week without activity. This pings
# /api/health (which runs a real database query) every other day, and fails the
# run — so GitHub emails the owner — if the site or database is down.
# Note: GitHub disables scheduled workflows after 60 days without repo activity.

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 https://lagkassan.vercel.app/api/health
